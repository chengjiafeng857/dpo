policy_name: Qwen/Qwen3-0.6B
ref_name: Qwen/Qwen3-0.6B
precision: bf16

dataset:
  dataset_name: Anthropic/hh-rlhf
  subset: train[:90%]
  val_ratio: 0.1
  seed: 42
  max_len: 256
  

dpo_training:
  epochs: 1
  batch_size: 8
  beta: 0.1
  learning_rate: 1e-6
  log_steps: 10

sft_training:
  enabled: true
  epochs: 1
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 1e-6
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  log_steps: 5
  eval_steps: 5
  evaluation_strategy: steps
  eval_accumulation_steps: 50
  # dataloader_num_workers: 4
  save_dir: ./logs/sft
  watch_log: gradients
  watch_log_freq: 100

hf_dpo_training:
  epochs: 1
  batch_size: 8
  beta: 0.1
  learning_rate: 1e-6
  logging_steps: 10
  seed: 42
  save_dir: ./logs/hf_dpo
